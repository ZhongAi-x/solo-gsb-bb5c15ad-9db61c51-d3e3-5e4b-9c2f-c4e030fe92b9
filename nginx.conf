server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带哈希的静态资源可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
